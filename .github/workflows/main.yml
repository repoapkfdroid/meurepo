name: Gerar Catalogo F-Droid Oficial

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Gerar Repositorio F-Droid via Docker
        run: |
          # 1. Garante que a pasta repo existe
          mkdir -p repo

          # 2. Executa o fdroid update dentro do container oficial com keeystore gerada na hora
          docker run --rm -v $(pwd):/repo fdroid/fdroidserver:latest bash -c "
            cd /repo && \
            keytool -genkey -v -keystore keystore.p12 -storetype PKCS12 -alias repo -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname 'CN=FDroidRepo' && \
            cat << 'EOF' > config.yml
repo_url: \"https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo\"
repo_name: \"Meu Repositorio F-Droid\"
repo_description: \"Repositorio de APKs\"
archive_older: 0
EOF
            fdroid update --create-metadata --keystore keystore.p12 --repo-keyalias repo --keystorepass 123456
          "

      - name: Preparar arquivos para o GitHub Pages
        run: |
          mkdir -p public
          cp -r repo public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
