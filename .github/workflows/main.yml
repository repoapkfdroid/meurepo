name: Gerar Catalogo F-Droid Oficial

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar Python e aapt
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 aapt

      - name: Gerar estrutura e indice F-Droid
        run: |
          mkdir -p public/repo
          
          # Copia os APKs para a pasta publica
          cp repo/*.apk public/repo/ 2>/dev/null || true

          # Gera um index-v1.json basico valido para o Droid-ify
          cat << 'EOF' > public/repo/index-v1.json
          {
            "repo": {
              "name": "Meu Repositorio F-Droid",
              "summary": "Repositorio de APKs",
              "icon": "icon.png",
              "address": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/repo",
              "timestamp": 1700000000000
            },
            "apps": [],
            "packages": {}
          }
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
